<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeGuardian AI - Automated code review for any repository</title>
    <meta name="description" content="Analyze a repository for security risks, code quality problems, documentation gaps, and maintainability. Upload a ZIP or paste a GitHub URL." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://code-guardian-ai-orpin.vercel.app/" />
    <meta property="og:url" content="https://code-guardian-ai-orpin.vercel.app/" />
    <meta property="og:title" content="CodeGuardian AI - Automated code review for any repository" />
    <meta property="og:description" content="Analyze a repository for security risks, code quality problems, documentation gaps, and maintainability." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CodeGuardian AI - Automated code review for any repository" />
    <meta name="twitter:description" content="Analyze a repository for security risks, code quality problems, documentation gaps, and maintainability." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CodeGuardian AI",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any (web-based)",
      "description": "Analyze a repository for security risks, code quality problems, documentation gaps, and maintainability.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script>
      // Apply a saved theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem("cg-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
